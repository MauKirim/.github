<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Hexagonal Top Guide Wire in WhatsApp Emerald Green -->
  <polyline points="20,40 20,30 50,14 80,30 80,40" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Central M Valley Chevron Guide -->
  <polyline points="20,30 50,48 80,30" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="48" x2="50" y2="58" stroke="#10B981" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Top Isometric Roof Diamond Dots -->
  <g fill="#10B981">
    <circle cx="50" cy="22" r="3.2"/>
    <circle cx="36" cy="30" r="3.2"/>
    <circle cx="64" cy="30" r="3.2"/>
    <circle cx="50" cy="38" r="3.2"/>

    <!-- 5 Vertical Stream Columns (dot fade: size decreases downward from 3.2 to 0.6) -->
    <!-- Column 1: Left Outer Pillar (x=20) -->
    <circle cx="20" cy="50" r="3.2"/>
    <circle cx="20" cy="60" r="2.4"/>
    <circle cx="20" cy="70" r="1.7"/>
    <circle cx="20" cy="79" r="1.1"/>
    <circle cx="20" cy="87" r="0.6"/>

    <!-- Column 2: Left Diagonal Inward (x=35) -->
    <circle cx="35" cy="54" r="3.0"/>
    <circle cx="35" cy="63" r="2.3"/>
    <circle cx="35" cy="72" r="1.6"/>
    <circle cx="35" cy="80" r="1.0"/>
    <circle cx="35" cy="87" r="0.6"/>

    <!-- Column 3: Center M Valley (x=50) -->
    <circle cx="50" cy="66" r="2.8"/>
    <circle cx="50" cy="74" r="2.1"/>
    <circle cx="50" cy="82" r="1.5"/>
    <circle cx="50" cy="89" r="0.9"/>
    <circle cx="50" cy="95" r="0.55"/>

    <!-- Column 4: Right Diagonal Inward (x=65) -->
    <circle cx="65" cy="54" r="3.0"/>
    <circle cx="65" cy="63" r="2.3"/>
    <circle cx="65" cy="72" r="1.6"/>
    <circle cx="65" cy="80" r="1.0"/>
    <circle cx="65" cy="87" r="0.6"/>

    <!-- Column 5: Right Outer Pillar (x=80) -->
    <circle cx="80" cy="50" r="3.2"/>
    <circle cx="80" cy="60" r="2.4"/>
    <circle cx="80" cy="70" r="1.7"/>
    <circle cx="80" cy="79" r="1.1"/>
    <circle cx="80" cy="87" r="0.6"/>
  </g>
</svg>
